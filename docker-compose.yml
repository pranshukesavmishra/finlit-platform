# Local dev and the single-VPS production layout (Stage 1).
#   cp .env.example .env && docker compose up -d --build
#   docker compose run --rm worker ingest RELIANCE TCS INFY
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: finlit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finlit}
      POSTGRES_DB: finlit
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finlit"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # Snapshots are rebuilt from Postgres on a cold cache, so Redis needs no persistence.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://finlit:${POSTGRES_PASSWORD:-finlit}@db:5432/finlit
      REDIS_URL: redis://redis:6379/0
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://finlit:${POSTGRES_PASSWORD:-finlit}@db:5432/finlit
      REDIS_URL: redis://redis:6379/0
    entrypoint: ["python", "-m", "finlit.worker"]
    command: ["migrate"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  # Long-running: ingests stocks users open before they have a snapshot.
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://finlit:${POSTGRES_PASSWORD:-finlit}@db:5432/finlit
      REDIS_URL: redis://redis:6379/0
    entrypoint: ["python", "-m", "finlit.worker"]
    command: ["drain-queue", "--loop"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

volumes:
  pgdata:
