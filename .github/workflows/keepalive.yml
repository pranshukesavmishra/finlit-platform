name: Keep the free servers awake
# Free Render services sleep after 15 minutes without traffic, which pauses the background data load and makes the first visitor
# wait about a minute. This pings them every 10 minutes. Set the repository variables SITE_URL (the main service) and
# SITE_API_PING_URL (the site backend, e.g. https://finlit-site-api.onrender.com/api/) under
# Settings -> Secrets and variables -> Actions -> Variables. Without them nothing runs.
on:
  schedule: [{cron: "*/10 * * * *"}]
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_API_PING_URL: ${{ vars.SITE_API_PING_URL }}
    steps:
      - run: |
          [ -z "$SITE_URL" ] || curl -fsS --retry 3 --max-time 90 "$SITE_URL/api/health"
          [ -z "$SITE_API_PING_URL" ] || curl -fsS --retry 3 --max-time 90 "$SITE_API_PING_URL" >/dev/null
